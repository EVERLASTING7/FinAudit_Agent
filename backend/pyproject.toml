[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finaudit-backend"
version = "0.1.0"
description = "FinAudit Agent FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19,<1.20",
    "argon2-cffi>=25.1,<26",
    "celery[redis]>=5,<6",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "jsonschema==4.26.0",
    "markdown-it-py==4.2.0",
    "minio>=7.2.20,<8",
    "PyJWT[crypto]>=2.10,<3",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "psycopg[binary]>=3.3,<3.4",
    "pypdf==6.14.2",
    "python-multipart>=0.0.22,<0.1",
    "reportlab==5.0.0",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.52,<0.53",
    "XlsxWriter==3.2.9",
]

[project.scripts]
finaudit-bootstrap-admin = "app.bootstrap_admin:main"
finaudit-dispatcher = "app.workers.dispatcher_process:main"
finaudit-maintenance = "app.workers.maintenance_process:main"
finaudit-publish-audit-rules = "app.audit.rule_catalog:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ai.artifacts.cr011_v1" = ["*.json"]
"app.ai.artifacts.minimax_m3_bailian_qwen37_local_v2" = ["*.json"]
"app.workers.artifacts.file_v1" = ["*.json"]
"app.workers.artifacts.invoice_v1" = ["*.json"]
"app.workers.artifacts.invoice_v2" = ["*.json"]
"app.workers.artifacts.knowledge_v1" = ["*.json"]
"app.workers.artifacts.audit_v1" = ["*.json"]
"app.workers.artifacts.report_v1" = ["*.json"]
"app.reports" = ["assets/fonts/*.ttf", "assets/fonts/NOTICE", "assets/fonts/README.txt", "assets/fonts/SOURCE.txt"]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "integration: requires explicitly configured external test infrastructure",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]
