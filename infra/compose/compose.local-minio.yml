name: finaudit-local-minio

services:
  minio:
    image: minio/minio:${MINIO_IMAGE_TAG:?MINIO_IMAGE_TAG is required}@${MINIO_IMAGE_DIGEST:?MINIO_IMAGE_DIGEST is required}
    command: ["server", "/data"]
    environment:
      MINIO_BROWSER: "off"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  minio_data:
